name: Build 3DS Game

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Lovebrew
        run: npm install -g lovebrew

      - name: Build for 3DS
        run: lovebrew compile --target ctr

      - name: Upload 3DS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-game
          path: output/*.3dsx
